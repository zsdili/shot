name: Build TinyShot
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6  # 升级以消除 Node.js 20 警告[reference:6]

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4.0.0  # 替代 ilammy/msvc-dev-cmd，支持 Node.js 24[reference:7]
      with:
        arch: x64

    - name: Compile with cl.exe
      shell: cmd
      run: |
        cl /O2 /MD /EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS shot.cpp ^
           /link /SUBSYSTEM:WINDOWS ^
           user32.lib gdi32.lib gdiplus.lib shell32.lib advapi32.lib
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TinyShot-exe
        path: shot.exe
